defaults: &safe_ss
  type: ss
  server: 192.0.2.31
  port: 8388
  cipher: aes-128-gcm
  password: anchor-password
proxies:
  - <<: *safe_ss
    name: Merged anchor
  - &direct_alias
    name: Direct anchor
    type: socks5
    server: socks-anchor.example
    port: 1080
    username: anchor-user
    password: anchor-socks-password
  - *direct_alias
