proxies:
  - name: Valid TUIC v5
    type: tuic
    server: tuic.example
    port: 443
    uuid: 99999999-bbbb-cccc-dddd-eeeeeeeeeeee
    password: tuic-password
    sni: tuic.example
    alpn:
      - h3
  - name: Invalid TUIC v4 token
    type: tuic
    server: tuic-v4.example
    port: 443
    token: tuic-v4-secret-token
  - name: Invalid SOCKS TLS
    type: socks5
    server: socks-tls.example
    port: 1080
    tls: true
  - name: Invalid Hysteria2 realm
    type: hysteria2
    server: hy2.example
    port: 443
    password: hy2-password
    realm: unsupported-realm
  - name: Unknown node
    type: future-protocol
    server: unknown.example
    port: 443
