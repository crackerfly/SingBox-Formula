name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub release when the matrix succeeds"
        type: boolean
        required: false
        default: true
      tag:
        description: "Release tag (blank = v<PKG_VERSION> read from the Makefile)"
        required: false
        default: ""

permissions:
  contents: read

# 同一个 ref 的运行串行排队，网页连续上传的每个 push 都会完成。不同 ref
# 可能携带同一个 PKG_VERSION；release job 另有版本级锁和 tag SHA 校验。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
  queue: max

env:
  MAIN_PACKAGE: liquid-formula
  LUCI_PACKAGE: luci-app-liquid-formula
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Source / shell / Go tests. Cheap, runs on every trigger, gates the rest.
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-24.04
    outputs:
      pkg_version: ${{ steps.meta.outputs.pkg_version }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore executable modes after web upload
        run: sh .github/scripts/restore-executable-modes.sh "$GITHUB_WORKSPACE"

      - name: Set up pinned Go toolchain for tests
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache-dependency-path: openwrt-feed/liquid-formula/src/go.sum

      # Vendored third-party sources are pinned by hash. Verify before anything
      # else so a swapped FakeHTTP/FakeSIP tarball fails in seconds rather than
      # after the whole architecture matrix has built it.
      - name: Verify vendored third-party sources
        run: |
          set -eux
          sha256sum -c third_party/SHA256SUMS

      - name: Run source, shell, and converter tests
        run: |
          set -eux
          for test_script in tests/shell/test_*.sh; do
            if [ "${test_script}" = tests/shell/test_subscription_normalize.sh ]; then
              continue
            fi
            sh "${test_script}"
          done
          LIQUID_FORMULA_NORMALIZER_RACE=1 sh tests/shell/test_subscription_normalize.sh
          node --check openwrt-feed/luci-app-liquid-formula/root/www/luci-static/resources/view/liquid-formula/overview.js
          # node --check 只验语法。这一步真的把每个视图 load()+render() 跑一遍,
          # 未定义变量之类的运行时错误才会在 CI 里暴露。
          node tests/shell/test_view_render.js

          sh -n openwrt-feed/luci-app-liquid-formula/root/usr/libexec/rpcd/liquid_formula

          # 上传 CGI 只接受 root 拥有的私有目录。以 root 跑这批测试, 是为了在
          # 和生产相同的权限模型下验证, 而不是为了迁就 runner 的非特权用户去
          # 放宽那条安全检查。
          # DPI 回归里有一个直接喂畸形包给 FakeHTTP 解析器的 C 测试。
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnetfilter-queue-dev libnfnetlink-dev libmnl-dev
          sudo -E tests/dpi/run.sh
          sh .github/tests/test-release-workflow.sh
          python3 .github/scripts/lint-workflow-pipes.py \
            .github/workflows/build.yml \
            .github/actions/build-package/action.yml
          cd openwrt-feed/liquid-formula/src
          go test -race ./...
          go vet ./...
          go mod tidy -diff

      # OpenWrt 24.10 ships Go 1.23.x while 25.12 ships 1.26. Building with the
      # oldest supported toolchain here catches a go.mod / dependency bump that
      # would otherwise fail every single 24.10 job in the matrix.
      - name: Set up the oldest supported Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.12'
          # The Go 1.26 setup above already restored and populated GOMODCACHE
          # and GOCACHE in this job. Restoring a second cache into those same
          # directories makes tar report "Cannot open: File exists".
          cache: false

      - name: Verify the converter still builds on OpenWrt 24.10's Go
        run: |
          set -eux
          GO_BIN=go sh tests/shell/test_subscription_normalize.sh
          cd openwrt-feed/liquid-formula/src
          go version
          go build ./...

      - name: Read package version and decide whether to release
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="$(sed -n 's/^PKG_VERSION:=\(.*\)$/\1/p' "openwrt-feed/${MAIN_PACKAGE}/Makefile")"
          test -n "${version}"
          # 三个包必须同版本, 否则一次发布里会混进不同版本的产物。
          for package in "${LUCI_PACKAGE}"; do
            other="$(sed -n 's/^PKG_VERSION:=\(.*\)$/\1/p' "openwrt-feed/${package}/Makefile")"
            if [ "${version}" != "${other}" ]; then
              echo "PKG_VERSION mismatch: ${MAIN_PACKAGE}=${version} ${package}=${other}" >&2
              exit 1
            fi
          done

          # tag 触发时, tag 必须和源码里的版本一致, 否则会把当前源码发布到
          # 另一个版本名下。
          if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/}" ]; then
            tag_name="${GITHUB_REF#refs/tags/}"
            if [ "${tag_name}" != "v${version}" ]; then
              echo "tag ${tag_name} does not match PKG_VERSION ${version} (expected v${version})" >&2
              exit 1
            fi
          fi
          echo "pkg_version=${version}" >> "$GITHUB_OUTPUT"
          echo "Package version: ${version}"

          # Auto-release on an ordinary push (this is how the web uploader
          # lands changes) whenever v<version> has no release yet. Bumping
          # PKG_VERSION is therefore the only thing needed to cut a release,
          # and re-uploading the same version never republishes it.
          should_release=false
          if [ "${GITHUB_EVENT_NAME}" = push ] && [ "${GITHUB_REF}" = "${GITHUB_REF#refs/tags/}" ]; then
            if gh release view "v${version}" >/dev/null 2>&1; then
              echo "Release v${version} already exists - this push only runs the smoke build."
            else
              should_release=true
              echo "No release for v${version} yet - this push builds every architecture and publishes."
            fi
          fi
          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2. Resolve point releases and validate every arch -> target mapping BEFORE
  #    spending ~43 SDK builds on it. A wrong mapping fails here in a minute.
  # ---------------------------------------------------------------------------
  prepare:
    name: Resolve matrix
    needs: test
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      needs.test.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.build_matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve versions and verify SDK targets
        id: build_matrix
        run: |
          set -euo pipefail
          python3 .github/scripts/resolve-matrix.py \
            --matrix .github/arch-matrix.json \
            --output matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 3. Full architecture matrix. Only for dispatch / tag pushes.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.entry.openwrt_version }} ${{ matrix.entry.arch }}
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        entry: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore executable modes after web upload
        run: sh .github/scripts/restore-executable-modes.sh "$GITHUB_WORKSPACE"

      - name: Build package
        uses: ./.github/actions/build-package
        with:
          openwrt_version: ${{ matrix.entry.openwrt_version }}
          openwrt_target: ${{ matrix.entry.target }}
          arch: ${{ matrix.entry.arch }}
          collect_luci: ${{ matrix.entry.collect_luci }}
          main_package: ${{ env.MAIN_PACKAGE }}
          luci_package: ${{ env.LUCI_PACKAGE }}

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: pkg-${{ matrix.entry.openwrt_version }}-${{ matrix.entry.arch }}
          path: output_pkg/*
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 4. Smoke build for ordinary pushes / PRs: one target, no release. Keeps the
  #    package build honest without queueing 43 jobs on every commit.
  # ---------------------------------------------------------------------------
  smoke:
    name: Smoke build
    needs: test
    if: |
      needs.test.outputs.should_release != 'true' &&
      ((github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')) ||
       github.event_name == 'pull_request')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore executable modes after web upload
        run: sh .github/scripts/restore-executable-modes.sh "$GITHUB_WORKSPACE"

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          python3 .github/scripts/resolve-matrix.py \
            --matrix .github/arch-matrix.json \
            --only-version 25.12 \
            --only-arch aarch64_cortex-a53 \
            --output smoke.json
          version="$(python3 -c 'import json;print(json.load(open("smoke.json"))[0]["openwrt_version"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build package
        uses: ./.github/actions/build-package
        with:
          openwrt_version: ${{ steps.ver.outputs.version }}
          openwrt_target: mediatek/mt7622
          arch: aarch64_cortex-a53
          collect_luci: "true"
          main_package: ${{ env.MAIN_PACKAGE }}
          luci_package: ${{ env.LUCI_PACKAGE }}

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: smoke-aarch64_cortex-a53
          path: output_pkg/*
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 5. Collect every artifact and publish a GitHub release tagged with the
  #    package version.
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: [test, build]
    if: |
      needs.build.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish_release) ||
       startsWith(github.ref, 'refs/tags/v') ||
       needs.test.outputs.should_release == 'true')
    runs-on: ubuntu-24.04
    # Workflow-level concurrency cannot use outputs read from the checkout.
    # At job level `needs` is available, so every ref publishing the same
    # package version shares one FIFO queue.
    concurrency:
      group: release-${{ github.workflow }}-${{ needs.test.outputs.pkg_version }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: pkg-*
          path: artifacts

      - name: Assemble release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 .github/scripts/collect-release-assets.py \
            --input artifacts --output dist \
            --main "${MAIN_PACKAGE}" --luci "${LUCI_PACKAGE}"
          (cd dist && sha256sum ./* > SHA256SUMS)
          ls -l dist

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          PKG_VERSION: ${{ needs.test.outputs.pkg_version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/}" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          elif [ -n "${INPUT_TAG}" ]; then
            # 手动输入的 tag 同样必须对上源码版本, 否则可以把当前产物
            # 发布到任意或更旧的 tag 上。
            if [ "${INPUT_TAG}" != "v${PKG_VERSION}" ]; then
              echo "requested tag ${INPUT_TAG} does not match PKG_VERSION ${PKG_VERSION} (expected v${PKG_VERSION})" >&2
              exit 1
            fi
            tag="${INPUT_TAG}"
          else
            tag="v${PKG_VERSION}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag}"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PKG_VERSION: ${{ needs.test.outputs.pkg_version }}
        run: |
          set -euo pipefail
          {
            echo "Liquid Formula ${PKG_VERSION}"
            echo
            echo "Builds for OpenWrt 24.10 and 25.12."
            echo
            echo "- \`liquid-formula_<arch>_openwrt-<version>\` — the converter plus the"
            echo "  FakeHTTP and FakeSIP helpers, one file per CPU architecture."
            echo "- \`luci-app-liquid-formula_all_openwrt-<version>\` — the web UI. It is"
            echo "  architecture independent (\`PKGARCH:=all\`), so one file per OpenWrt"
            echo "  release covers every device."
            echo
            echo "Install the service package first, then the LuCI app."
            echo "Checksums are in \`SHA256SUMS\`."
          } > NOTES.md

          sh .github/scripts/publish-release.sh \
            "${TAG}" "${GITHUB_SHA}" dist NOTES.md
